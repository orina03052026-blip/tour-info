<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Availability | Kana Sho Tours</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Helvetica Neue', Arial, sans-serif;
  background: #f0f7fa;
  padding: 20px;
  color: #333;
}

.staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 25px;
  max-width: 1000px;
  margin: 0 auto;
}

.staff-card {
  background: white;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

.staff-header {
  padding: 20px;
  text-align: center;
  color: white;
}

.staff-header.kana { background: linear-gradient(135deg, #ff7eb3, #ff758c); }
.staff-header.sho { background: linear-gradient(135deg, #2af598, #009efd); }

.staff-name {
  font-size: 1.8rem;
  font-weight: bold;
  margin-bottom: 5px;
}

/* ★ 日付を大きく */
.tour-date {
  font-size: 1.8rem;
  font-weight: bold;
  background: rgba(255,255,255,0.2);
  border-radius: 10px;
  padding: 8px 18px;
  display: inline-block;
}

.slots { padding: 20px; }

.slot { margin-bottom: 20px; }

.slot-label {
  font-size: 0.9rem;
  color: #666;
  font-weight: bold;
  margin-bottom: 8px;
}

select.booking-select {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid #ddd;
  font-size: 0.95rem;
  cursor: pointer;
}

select.booking-select.available {
  border-color: #00a388;
  color: #00a388;
  background-color: #f0fff4;
  font-weight: bold;
}

select.booking-select.busy {
  border-color: #e53e3e;
  color: #e53e3e;
  background-color: #fff5f5;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="staff-grid" id="container">Loading availability...</div>

<script>

// ★ GASのURL（あなたのURL）
const GAS_URL = 'https://script.google.com/macros/s/AKfycby7GsoS7igT4GWLRU5ThNRKy6Osnh2WK74aUn7-keFuUTAuZtsmNrEbNfvhS1XmKrJ6/exec';

// ★ ツアー情報（定員付き）
const tourInfo = [
  { id: 'kyu', name: "e-bike Ride around the Castle, Slurp Like a Local", url: "https://www.travel-network-act.co.jp/local/en/castle-town/", cap: 4 },
  { id: 'shikama', name: "e-bike Ride to the Sea, Slurp Like a Local", url: "https://www.travel-network-act.co.jp/local/en/tour-from-the-shikama-kaido-to-the-sea/", cap: 4 },
  { id: 'castle', name: "Himeji castle guide tour", url: "https://www.travel-network-act.co.jp/local/en/himeji-castle-guide-personal-tour/", cap: 8 }
];

// ★ 日付フォーマット（5 May）
function formatInboundDate(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return dateStr;

  const day = d.getDate();
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${day} ${months[d.getMonth()]}`;
}

// ★ プルダウン生成
function createSelectHtml(kyuVal, shikamaVal, castleVal) {

  if (kyuVal === "休み" || shikamaVal === "休み" || castleVal === "休み") {
    return `<select class="booking-select busy" disabled>
      <option>Day Off / Not Available</option>
    </select>`;
  }

  let activeTour = null;

  if (kyuVal && !isNaN(kyuVal)) activeTour = tourInfo[0];
  else if (shikamaVal && !isNaN(shikamaVal)) activeTour = tourInfo[1];
  else if (castleVal && !isNaN(castleVal)) activeTour = tourInfo[2];

  // ★ 予約あり → そのツアーだけ
  if (activeTour) {
    return `
      <select class="booking-select available"
  onchange="if(this.value) window.top.location.href=this.value">
        <option value="">▼ Ongoing: ${activeTour.name} (Max ${activeTour.cap})</option>
        <option value="${activeTour.url}">Join this tour</option>
      </select>`;
  }

  // ★ 全ツアー表示
  return `
   <select class="booking-select available"
  onchange="if(this.value) window.top.location.href=this.value">
      <option value="">▼ Select a Tour</option>
      ${tourInfo.map(t => `
        <option value="${t.url}">
          ${t.name} (Max ${t.cap})
        </option>
      `).join('')}
    </select>`;
}

// ★ データ読み込み
async function loadData() {
  const container = document.getElementById('container');

  try {
    const res = await fetch(GAS_URL);
    const data = await res.json();

    container.innerHTML = data.map(item => `
      <div class="staff-card">
        <div class="staff-header ${(item.staff || '').toLowerCase() === 'kana' ? 'kana' : 'sho'}">
          <div class="staff-name">${item.staff}</div>
          <div class="tour-date">${formatInboundDate(item.date)}</div>
        </div>

        <div class="slots">
          <div class="slot">
            <div class="slot-label">MORNING (AM)</div>
            ${createSelectHtml(item.am_kyu, item.am_shikama, item.am_castle)}
          </div>

          <div class="slot">
            <div class="slot-label">AFTERNOON (PM)</div>
            ${createSelectHtml(item.pm_kyu, item.pm_shikama, item.pm_castle)}
          </div>
        </div>
      </div>
    `).join('');

  } catch (e) {
    console.error(e);
    container.innerHTML = "Error loading data";
  }
}

loadData();

</script>
</body>
</html>
