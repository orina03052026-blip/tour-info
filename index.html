<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Availability | Kana Sho Tours</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f7fa;
      min-height: 100vh;
    }

    /* ---- ヘッダー ---- */
    header {
      background: linear-gradient(160deg, #1a1a2e 0%, #0f3460 100%);
      color: white;
      text-align: center;
      padding: 28px 16px 22px;
    }
    header h1 { font-size: 1.55rem; letter-spacing: 0.1em; }
    header .subtitle { font-size: 0.8rem; opacity: 0.6; letter-spacing: 0.15em; margin-top: 4px; }
    header .date { font-size: 0.92rem; opacity: 0.85; margin-top: 10px; }
    .refresh-btn {
      display: inline-block;
      margin-top: 12px;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 5px 20px;
      font-size: 0.78rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .refresh-btn:active { background: rgba(255,255,255,0.25); }

    .container { padding: 16px; max-width: 680px; margin: 0 auto; }

    /* ---- 日付セクション ---- */
    .day-section { margin-bottom: 24px; }
    .day-section:last-child { margin-bottom: 0; }

    .day-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      color: #1a1a2e;
      margin-bottom: 12px;
      padding: 8px 4px;
      border-bottom: 2px solid #0f3460;
    }
    .day-badge {
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 12px;
      color: white;
      font-weight: normal;
      letter-spacing: 0.05em;
    }
    .day-badge.today    { background: #d63384; }
    .day-badge.tomorrow { background: #0f3460; }
    .day-badge.after2   { background: #5a6c8a; }

    .staff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 380px) {
      .staff-grid { grid-template-columns: 1fr; }
    }

    .empty-day {
      background: white;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      color: #aaa;
      font-size: 0.85rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* ---- スタッフカード ---- */
    .staff-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.09);
    }

    .staff-header {
      padding: 16px 14px 14px;
      text-align: center;
      color: white;
    }
    .staff-header.kana { background: linear-gradient(135deg, #d63384, #ff6eb0); }
    .staff-header.sho  { background: linear-gradient(135deg, #0a7a6a, #1bc9a8); }

    .staff-avatar { font-size: 2.2rem; line-height: 1; }
    .staff-name {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      margin-top: 6px;
    }

    /* ---- AM / PM セクション ---- */
    .time-section {
      padding: 12px 13px;
      border-bottom: 1px solid #f3f3f3;
    }
    .time-section:last-child { border-bottom: none; }

    .time-label {
      font-size: 0.68rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: #ccc;
      margin-bottom: 9px;
    }

    /* ---- ツアーチップ ---- */
    .tour-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: bold;
      line-height: 1.4;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 予約可能：緑 */
    .chip.open {
      background: #e6f7ee;
      color: #1a7f4b;
      border: 1.5px solid #a8e6c0;
    }

    /* 満員（取り消し線グレー） */
    .chip.closed {
      background: #f5f5f5;
      color: #bbb;
      border: 1.5px solid #e0e0e0;
      text-decoration: line-through;
      text-decoration-color: #ccc;
    }

    /* 受付終了バッジ */
    .chip.sold-out {
      background: #fff0e6;
      color: #c85000;
      border: 1.5px solid #ffd0a8;
      font-size: 0.82rem;
    }

    /* 休み・終了：グレー */
    .chip.off {
      background: #f5f5f5;
      color: #bbb;
      border: 1.5px solid #e8e8e8;
    }

    /* ---- 予約可能時のプルダウン ---- */
    .tour-select {
      width: 100%;
      padding: 7px 10px;
      font-size: 0.78rem;
      font-weight: bold;
      font-family: inherit;
      color: #1a7f4b;
      background: #e6f7ee;
      border: 1.5px solid #a8e6c0;
      border-radius: 8px;
      cursor: pointer;
    }
    .tour-select:focus {
      outline: 2px solid #1a7f4b;
      outline-offset: 1px;
    }

    /* ---- 汎用メッセージ ---- */
    .status-msg {
      text-align: center;
      color: #aaa;
      padding: 52px 20px;
      font-size: 0.95rem;
      line-height: 2;
    }
    .status-msg.error { color: #cc3333; }

    .closed-msg {
      background: white;
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
    }
    .closed-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .closed-msg h2 { font-size: 1.05rem; color: #555; margin-bottom: 10px; }
    .closed-msg p  { font-size: 0.85rem; color: #aaa; line-height: 1.8; }

    footer {
      text-align: center;
      color: #ccc;
      font-size: 0.7rem;
      padding: 18px;
    }
  </style>
</head>
<body>

<header>
  <h1>🚲 Availability</h1>
  <p class="subtitle">3 DAYS SCHEDULE</p>
  <p class="date" id="date-display"></p>
  <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
</header>

<div class="container">
  <div id="main-container">
    <div class="status-msg">Loading...</div>
  </div>
</div>

<footer>Last updated: <span id="update-time">-</span></footer>

<script>
  // ============================================================
  // ★★★ ここだけ変更してください ★★★
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Lyl_tjTHza8Wfp2WiDepi_ZTY_Xo6Xqpuhgog-lufFY/export?format=csv&gid=0';
  // ============================================================

  const STAFF = {
    'Kana': { cls: 'kana', avatar: '🌸' },
    'Sho':  { cls: 'sho',  avatar: '🌊' },
  };

  // 公式表記（act_travel/hp/system_notes/error_prevention_memo.md §3 準拠）
  const ALL_TOURS = [
    'e-bike Ride around the Castle, Slurp Like a Local',
    'e-bike Ride to the Sea, Slurp Like a Local',
    'Himeji castle guide tour',
  ];

  // プルダウン選択時の遷移先（WordPress 公開ページ）
  const BOOKING_URLS = {
    'e-bike Ride around the Castle, Slurp Like a Local':
      'https://www.travel-network-act.co.jp/local/en/castle-town/',
    'e-bike Ride to the Sea, Slurp Like a Local':
      'https://www.travel-network-act.co.jp/local/en/tour-from-the-shikama-kaido-to-the-sea/',
    'Himeji castle guide tour':
      'https://www.travel-network-act.co.jp/local/en/himeji-castle-guide-personal-tour/',
  };

  const DAY_LABELS = ['Today', 'Tomorrow', 'Day After'];
  const DAY_BADGE  = ['today', 'tomorrow', 'after2'];
  const WEEKDAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS     = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // 今日・明日・明後日（日本時間）の年月日を作る
  function buildTargetDays() {
    const now = new Date();
    const y = parseInt(now.toLocaleDateString('en-US', { timeZone: 'Asia/Tokyo', year:  'numeric' }));
    const m = parseInt(now.toLocaleDateString('en-US', { timeZone: 'Asia/Tokyo', month: 'numeric' }));
    const d = parseInt(now.toLocaleDateString('en-US', { timeZone: 'Asia/Tokyo', day:   'numeric' }));
    const days = [];
    for (let i = 0; i < 3; i++) {
      const dt = new Date(y, m - 1, d + i);
      days.push({ y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate(), w: dt.getDay() });
    }
    return days;
  }
  const TARGET_DAYS = buildTargetDays();

  // ヘッダーの日付レンジ表示
  (function setHeaderDate() {
    const a = TARGET_DAYS[0], b = TARGET_DAYS[2];
    document.getElementById('date-display').textContent =
      `${MONTHS[a.m-1]} ${a.d} (${WEEKDAYS[a.w]}) – ${MONTHS[b.m-1]} ${b.d} (${WEEKDAYS[b.w]})`;
  })();

  // CSV日付セル → TARGET_DAYS のインデックス（0/1/2）または -1
  // 公式仕様は yyyy年M月d日（例: 2026年5月4日）。互換のため /, - 区切りも残す。
  function dayIndex(str) {
    if (!str || str === '日付') return -1;
    const s = str.replace(/年/g, '/').replace(/月/g, '/').replace(/日/g, '');
    const parts = s.split(/[\/\-]/).map(p => parseInt(p.trim())).filter(n => !isNaN(n));
    let y, m, d;
    if (parts.length === 2) {
      y = TARGET_DAYS[0].y; m = parts[0]; d = parts[1];
    } else if (parts.length === 3 && parts[0] > 31) {
      y = parts[0]; m = parts[1]; d = parts[2];
    } else if (parts.length === 3) {
      m = parts[0]; d = parts[1]; y = parts[2];
    } else { return -1; }
    for (let i = 0; i < TARGET_DAYS.length; i++) {
      const t = TARGET_DAYS[i];
      if (t.y === y && t.m === m && t.d === d) return i;
    }
    return -1;
  }

  // CSV1行をカラム配列に変換（引用符内のカンマ対応）
  function parseRow(row) {
    const cols = []; let cur = ''; let inQ = false;
    for (let i = 0; i < row.length; i++) {
      const c = row[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    return cols;
  }

  // ---- 表示ロジック ----

  function timeSection(label, status) {
    let html;
    if (status === '予約可能') {
      html = `<select class="tour-select" onchange="if(this.value)window.open(this.value,'_top')">
                <option value="">▼ Select a tour</option>
                ${ALL_TOURS.map(t => `<option value="${BOOKING_URLS[t] || ''}">${t}</option>`).join('')}
              </select>`;
    } else if (status === '満員') {
      html = `<span class="chip sold-out">× Fully Booked</span>`
           + ALL_TOURS.map(t => `<span class="chip closed">${t}</span>`).join('');
    } else {
      html = `<span class="chip off">– Day Off</span>`;
    }
    return `<div class="time-section"><div class="time-label">${label}</div><div class="tour-list">${html}</div></div>`;
  }

  function staffCard(m) {
    const s = STAFF[m.staff] || { cls: '', avatar: '👤' };
    return `<div class="staff-card">
              <div class="staff-header ${s.cls}">
                <div class="staff-avatar">${s.avatar}</div>
                <div class="staff-name">${m.staff}</div>
              </div>
              ${timeSection('AM', m.amStatus)}
              ${timeSection('PM', m.pmStatus)}
            </div>`;
  }

  function daySection(idx, rows) {
    const t = TARGET_DAYS[idx];
    const head = `<div class="day-header">
                    📅 ${MONTHS[t.m-1]} ${t.d} (${WEEKDAYS[t.w]})
                    <span class="day-badge ${DAY_BADGE[idx]}">${DAY_LABELS[idx]}</span>
                  </div>`;
    const body = rows.length
      ? `<div class="staff-grid">${rows.map(staffCard).join('')}</div>`
      : `<div class="empty-day">No schedule</div>`;
    return `<div class="day-section">${head}${body}</div>`;
  }

  // ---- CSV取得・表示 ----

  async function loadData() {
    const el = document.getElementById('main-container');
    el.innerHTML = '<div class="status-msg">Loading...</div>';
    try {
      const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const lines = text.trim().split('\n').slice(1);

      const grouped = [[], [], []];
      lines.forEach(line => {
        const c = parseRow(line);
        const i = dayIndex(c[0]);
        if (i < 0 || !c[1]) return;
        grouped[i].push({ staff: c[1], amStatus: c[2], pmStatus: c[3] });
      });

      if (grouped.every(g => g.length === 0)) {
        el.innerHTML = `<div class="closed-msg">
          <div class="icon">🌅</div>
          <h2>No schedule for the next 3 days</h2>
          <p>Please check back later.</p>
        </div>`;
        return;
      }

      el.innerHTML = grouped.map((rows, i) => daySection(i, rows)).join('');
      document.getElementById('update-time').textContent =
        new Date().toLocaleTimeString('en-US', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false });
    } catch(e) {
      el.innerHTML = '<div class="status-msg error">⚠ Could not load data: ' + e.message + '</div>';
    }
  }

  loadData();
  setInterval(loadData, 10 * 60 * 1000);
</script>

</body>
</html>
