<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のツアー | Ka Na Sho</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f7fa;
      min-height: 100vh;
    }

    /* ---- ヘッダー ---- */
    header {
      background: linear-gradient(160deg, #1a1a2e 0%, #0f3460 100%);
      color: white;
      text-align: center;
      padding: 28px 16px 22px;
    }
    header h1 { font-size: 1.55rem; letter-spacing: 0.1em; }
    header .subtitle { font-size: 0.8rem; opacity: 0.6; letter-spacing: 0.15em; margin-top: 4px; }
    header .date { font-size: 0.92rem; opacity: 0.85; margin-top: 10px; }
    .refresh-btn {
      display: inline-block;
      margin-top: 12px;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 5px 20px;
      font-size: 0.78rem;
      cursor: pointer;
      letter-spacing: 0.05em;
    }
    .refresh-btn:active { background: rgba(255,255,255,0.25); }

    /* ---- グリッド ---- */
    .container { padding: 16px; max-width: 680px; margin: 0 auto; }

    .staff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    @media (max-width: 380px) {
      .staff-grid { grid-template-columns: 1fr; }
    }

    /* ---- スタッフカード ---- */
    .staff-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.09);
    }

    .staff-header {
      padding: 16px 14px 14px;
      text-align: center;
      color: white;
    }
    .staff-header.kana { background: linear-gradient(135deg, #d63384, #ff6eb0); }
    .staff-header.sho  { background: linear-gradient(135deg, #0a7a6a, #1bc9a8); }

    .staff-avatar { font-size: 2.2rem; line-height: 1; }
    .staff-name {
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      margin-top: 6px;
    }

    /* ---- AM / PM セクション ---- */
    .time-section {
      padding: 12px 13px;
      border-bottom: 1px solid #f3f3f3;
    }
    .time-section:last-child { border-bottom: none; }

    .time-label {
      font-size: 0.68rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: #ccc;
      margin-bottom: 9px;
    }

    /* ---- ツアーチップ ---- */
    .tour-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: bold;
      line-height: 1.4;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* 予約可能：緑 */
    .chip.open {
      background: #e6f7ee;
      color: #1a7f4b;
      border: 1.5px solid #a8e6c0;
    }

    /* 満員（取り消し線グレー） */
    .chip.closed {
      background: #f5f5f5;
      color: #bbb;
      border: 1.5px solid #e0e0e0;
      text-decoration: line-through;
      text-decoration-color: #ccc;
    }

    /* 受付終了バッジ */
    .chip.sold-out {
      background: #fff0e6;
      color: #c85000;
      border: 1.5px solid #ffd0a8;
      font-size: 0.82rem;
    }

    /* 休み・終了：グレー */
    .chip.off {
      background: #f5f5f5;
      color: #bbb;
      border: 1.5px solid #e8e8e8;
    }

    /* ---- 汎用メッセージ ---- */
    .status-msg {
      text-align: center;
      color: #aaa;
      padding: 52px 20px;
      font-size: 0.95rem;
      line-height: 2;
    }
    .status-msg.error { color: #cc3333; }

    /* 「本日の受付終了」メッセージ用 */
    .closed-msg {
      background: white;
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.07);
    }
    .closed-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .closed-msg h2 { font-size: 1.05rem; color: #555; margin-bottom: 10px; }
    .closed-msg p  { font-size: 0.85rem; color: #aaa; line-height: 1.8; }

    footer {
      text-align: center;
      color: #ccc;
      font-size: 0.7rem;
      padding: 18px;
    }
  </style>
</head>
<body>

<header>
  <h1>🚲 Ka Na Sho Tours</h1>
  <p class="subtitle">3 HOURS TOUR</p>
  <p class="date" id="date-display"></p>
  <button class="refresh-btn" onclick="loadData()">↻ 更新</button>
</header>

<div class="container">
  <div id="main-container">
    <div class="status-msg">読み込み中...</div>
  </div>
</div>

<footer>最終更新: <span id="update-time">-</span></footer>

<script>
  // ============================================================
  // ★★★ ここだけ変更してください ★★★
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1Lyl_tjTHza8Wfp2WiDepi_ZTY_Xo6Xqpuhgog-lufFY/export?format=csv&gid=0';
  // ============================================================

  const STAFF = {
    'Kana': { cls: 'kana', avatar: '🌸' },
    'Sho':  { cls: 'sho',  avatar: '🌊' },
  };

  const ALL_TOURS = [
    'E-Bike Ride around the Castle, Slurp like a Local',
    'e-bike Ride to the Sea, Slurp like a Local',
    'Himeji Castle Guide',
  ];

  // 今日の日付（日本時間）
  const _now = new Date();
  const todayY = parseInt(_now.toLocaleDateString('en-US', { timeZone: 'Asia/Tokyo', year:  'numeric' }));
  const todayM = parseInt(_now.toLocaleDateString('en-US', { timeZone: 'Asia/Tokyo', month: 'numeric' }));
  const todayD = parseInt(_now.toLocaleDateString('en-US', { timeZone: 'Asia/Tokyo', day:   'numeric' }));

  document.getElementById('date-display').textContent =
    _now.toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });

  // CSVの日付セルがどんな形式でも今日かどうか判定する
  function isToday(str) {
    if (!str || str === '日付') return false;
    var s = str.replace(/年/g, '/').replace(/月/g, '/').replace(/日/g, '');
    var parts = s.split(/[\/\-]/).map(p => parseInt(p.trim())).filter(n => !isNaN(n));
    var y, m, d;
    if (parts.length === 2) {
      y = todayY; m = parts[0]; d = parts[1];       // 5/3
    } else if (parts.length === 3 && parts[0] > 31) {
      y = parts[0]; m = parts[1]; d = parts[2];      // 2026/5/3
    } else if (parts.length === 3) {
      m = parts[0]; d = parts[1]; y = parts[2];      // 5/3/2026
    } else { return false; }
    return y === todayY && m === todayM && d === todayD;
  }

  // CSV1行をカラム配列に変換（引用符内のカンマ対応）
  function parseRow(row) {
    var cols = []; var cur = ''; var inQ = false;
    for (var i = 0; i < row.length; i++) {
      var c = row[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cols.push(cur.trim());
    return cols;
  }

  // ---- 表示ロジック ----

  function timeSection(label, status) {
    var html;
    if (status === '予約可能') {
      html = ALL_TOURS.map(t => `<span class="chip open">◯ ${t}</span>`).join('');
    } else if (status === '満員') {
      html = `<span class="chip sold-out">× Fully Booked</span>`
           + ALL_TOURS.map(t => `<span class="chip closed">${t}</span>`).join('');
    } else {
      html = `<span class="chip off">ー Day Off</span>`;
    }
    return `<div class="time-section"><div class="time-label">${label}</div><div class="tour-list">${html}</div></div>`;
  }

  function staffCard(m) {
    var s = STAFF[m.staff] || { cls: '', avatar: '👤' };
    return `<div class="staff-card">
              <div class="staff-header ${s.cls}">
                <div class="staff-avatar">${s.avatar}</div>
                <div class="staff-name">${m.staff}</div>
              </div>
              ${timeSection('AM', m.amStatus)}
              ${timeSection('PM', m.pmStatus)}
            </div>`;
  }

  // ---- CSV取得・表示 ----

  async function loadData() {
    var el = document.getElementById('main-container');
    el.innerHTML = '<div class="status-msg">読み込み中...</div>';
    try {
      var res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var text = await res.text();
      var lines = text.trim().split('\n').slice(1); // 1行目ヘッダーをスキップ
      var data = lines
        .map(parseRow)
        .filter(c => isToday(c[0]))
        .map(c => ({ staff: c[1], amStatus: c[2], pmStatus: c[3] }))
        .filter(r => r.staff);

      if (!data.length) {
        el.innerHTML = `<div class="closed-msg">
          <div class="icon">🌅</div>
          <h2>本日の受付は終了しました</h2>
          <p>またのご参加をお待ちしています。<br>お問い合わせはお気軽にどうぞ。</p>
        </div>`;
        return;
      }
      el.innerHTML = `<div class="staff-grid">${data.map(staffCard).join('')}</div>`;
      document.getElementById('update-time').textContent =
        new Date().toLocaleTimeString('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' });
    } catch(e) {
      el.innerHTML = '<div class="status-msg error">⚠ データを読み込めませんでした：' + e.message + '</div>';
    }
  }

  loadData();
  setInterval(loadData, 10 * 60 * 1000);
</script>

</body>
</html>
