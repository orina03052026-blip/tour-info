<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Availability | Kana Sho Tours</title>
  <style>
    /* デザインは維持 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f7fa; padding: 16px; }
    .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .staff-card { background: white; border-radius: 18px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.09); margin-bottom: 20px; }
    .staff-header { padding: 16px; text-align: center; color: white; background: #0f3460; }
    .staff-header.kana { background: linear-gradient(135deg, #d63384, #ff6eb0); }
    .staff-header.sho { background: linear-gradient(135deg, #0a7a6a, #1bc9a8); }
    .time-section { padding: 12px; border-bottom: 1px solid #eee; }
    .status-box { padding: 8px; border-radius: 8px; background: #e6f7ee; color: #1a7f4b; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

<div class="staff-grid" id="main-container">Loading...</div>

<script>
  // ★ここに新しいGASのURLを貼り付けてください
  const GAS_URL = 'ここにウェブアプリURLを貼り付け';

  async function loadData() {
    const container = document.getElementById('main-container');
    try {
      const response = await fetch(GAS_URL);
      const data = await response.json();
      
      container.innerHTML = data.map(item => `
        <div class="staff-card">
          <div class="staff-header ${item.staff === 'Kana' ? 'kana' : 'sho'}">
            <div style="font-size:1.4rem; font-weight:bold;">${item.staff}</div>
            <div style="font-size:0.9rem;">${item.date}</div>
          </div>
          <div class="time-section">
            <div style="font-size:0.7rem; color:#aaa;">AM</div>
            <div class="status-box">${item.am || '-'}</div>
          </div>
          <div class="time-section">
            <div style="font-size:0.7rem; color:#aaa;">PM</div>
            <div class="status-box">${item.pm || '-'}</div>
          </div>
        </div>
      `).join('');
    } catch (e) {
      container.innerHTML = "データの読み込みに失敗しました。";
    }
  }
  loadData();
</script>
</body>
</html>
